[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapekit"
version = "0.1.0"
description = "Registry-driven extraction client for a browser worker socket"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "openpyxl>=3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scrapekit = "scrapekit.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
